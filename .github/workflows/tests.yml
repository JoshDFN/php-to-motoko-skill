name: skill tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  WORK: /tmp/mpa-tests
  DB_ROOT: root
  DB_ROOT_PASS: root

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck php-cli && npm install -g npm@11
      - run: bash tests/test-lint.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm ic-mops
      - run: bash tests/test-backend.sh

  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-mysql php-xml php-mbstring php-curl php-zip php-gd php-intl
      - run: sudo systemctl start mysql
      - run: npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm ic-mops
      - run: bash tests/test-wordpress.sh

  drupal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-mysql php-xml php-mbstring php-curl php-zip php-gd php-intl
      - run: sudo systemctl start mysql
      - run: npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm ic-mops
      - run: bash tests/test-drupal.sh

  platform-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-mysql php-xml php-mbstring php-curl php-zip php-gd php-intl php-sqlite3 unzip
      - run: sudo systemctl start mysql
      - run: bash tests/test-notes.sh
